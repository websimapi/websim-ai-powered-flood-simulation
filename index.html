<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Flood Simulation</title>
    <link rel="stylesheet" href="style.css">
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "@tensorflow/tfjs": "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.es2017.js"
        }
    }
    </script>
</head>
<body>
    <div id="container">
        <canvas id="c"></canvas>
    </div>
    <div id="ui">
        <h1>AI-Powered Flood Simulation</h1>
        <p>A demonstration using a Transformer-based surrogate model (simulated) to predict floodwater spread. The model runs in-browser with TensorFlow.js and renders with Three.js.</p>
        <div class="control-group">
            <label for="rainfall">Rainfall Intensity</label>
            <input type="range" id="rainfall" min="0" max="0.05" step="0.001" value="0.0">
        </div>
        <div class="control-group">
            <button id="damBreak">Trigger Dam Break</button>
             <button id="reset">Reset Simulation</button>
        </div>
        <div id="info">Loading model and initializing...</div>
    </div>
    <script type="module" src="main.js"></script>

</body>
</html>
